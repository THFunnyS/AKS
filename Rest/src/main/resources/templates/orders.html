<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заказы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        nav a {
            margin-right: 15px;
        }

        .toolbar {
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .button, button {
            display: inline-block;
            padding: 8px 12px;
            border: 1px solid #999;
            border-radius: 4px;
            background: #f5f5f5;
            color: #222;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover, button:hover {
            background: #e5e5e5;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .actions form {
            margin: 0;
        }

        .message {
            padding: 12px;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .empty {
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
<h1>Заказы</h1>

<nav>
    <a th:href="@{/customers}">Покупатели</a>
    <a th:href="@{/orders}">Заказы</a>
</nav>

<div th:if="${successMessage}" class="message"
     th:text="${successMessage}"></div>
<div th:if="${errorMessage}" class="message"
     th:text="${errorMessage}"></div>

<div class="toolbar">
    <a class="button" th:href="@{/orders/new}">
        Добавить заказ
    </a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Дата</th>
        <th>Сумма</th>
        <th>Статус</th>
        <th>Покупатель</th>
        <th>Действия</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.orderDate != null ? order.orderDate : '—'}"></td>
        <td th:text="${order.totalSum}"></td>
        <td th:text="${order.status}"></td>
        <td th:text="${order.customerName != null ? order.customerName : 'Не указан'}"></td>
        <td>
            <div class="actions">
                <a class="button"
                   th:href="@{/orders/{id}/edit(id=${order.id})}">
                    Изменить
                </a>

                <form th:action="@{/orders/{id}/delete(id=${order.id})}"
                      method="post"
                      onsubmit="return confirm('Удалить этот заказ?');">
                    <button type="submit">Удалить</button>
                </form>
            </div>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="6" class="empty">Заказов пока нет</td>
    </tr>
    </tbody>
</table>
</body>
</html>
