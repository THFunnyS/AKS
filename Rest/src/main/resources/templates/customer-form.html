<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${customer.id == null ? 'Новый покупатель' : 'Редактирование покупателя'}">
        Покупатель
    </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        nav a {
            margin-right: 15px;
        }

        .form-group {
            margin-top: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        .button, button {
            display: inline-block;
            padding: 10px 14px;
            margin-top: 20px;
            border: 1px solid #999;
            border-radius: 4px;
            background: #f5f5f5;
            color: #222;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .message {
            padding: 12px;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<h1 th:text="${customer.id == null ? 'Добавление покупателя' : 'Редактирование покупателя'}">
    Покупатель
</h1>

<nav>
    <a th:href="@{/customers}">Покупатели</a>
    <a th:href="@{/orders}">Заказы</a>
</nav>

<div th:if="${errorMessage}" class="message"
     th:text="${errorMessage}"></div>

<form th:object="${customer}"
      th:action="${customer.id == null}
          ? @{/customers/create}
          : @{/customers/{id}/update(id=${customer.id})}"
      method="post">

    <div class="form-group">
        <label for="name">Имя *</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               maxlength="50"
               required>
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               maxlength="100">
    </div>

    <div class="form-group">
        <label for="phone">Телефон</label>
        <input type="text"
               id="phone"
               th:field="*{phone}"
               maxlength="20">
    </div>

    <button type="submit"
            th:text="${customer.id == null ? 'Создать' : 'Сохранить'}">
        Сохранить
    </button>

    <a class="button" th:href="@{/customers}">Отмена</a>
</form>

</body>
</html>
